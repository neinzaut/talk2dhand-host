<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/learningName.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talk2DHand</title>
    <link rel="stylesheet" href="/static/css/popupInstructions.css" >
    <link rel="icon" href="/static/images/logo_notext.png" type="image/png">
    
    <!-- MediaPipe libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    
    <!-- Load camera handler first so it's available to the page -->
    <script src="/static/JS/camera-handler.js"></script>
    
    <style>
        /* Additional CSS for camera elements */
        #webcam {
            width: 100%;
            max-width: 320px;
            border-radius: 10px;
            border: 2px solid #304C89;
        }
        #canvas {
            width: 320px; 
            height: 240px;
            display: none;
        }
        .status {
            margin-top: 10px;
            padding: 8px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
        }
        .status.success {
            background-color: #d4edda;
            color: #155724;
        }
        .status.error {
            background-color: #f8d7da;
            color: #721c24;
        }
        .status.info {
            background-color: #d1ecf1;
            color: #0c5460;
        }
        #predictionText {
            font-size: 24px;
            font-weight: bold;
            margin-top: 10px;
            padding: 5px;
            text-align: center;
        }
        .detection-indicator {
            display: inline-block;
            font-size: 12px;
            background-color: #28a745;
            color: white;
            padding: 3px 8px;
            border-radius: 10px;
            margin-top: 8px;
        }
        .detection-indicator::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #fff;
            border-radius: 50%;
            margin-right: 5px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }
    </style>
</head>

<!-- NAVBAR -->
<nav class="navbar">
    <img src="/static/images/logo_text.png" alt="Talk2DHand Icon" class="nav-logo">
    <div class="nav-links-container">
        <a href="/" class="nav-links">Home</a>
        <a href="/learning" class="nav-links">Learning</a>
        <a href="/practicing" class="nav-links">Practice</a>
        <a href="/test" class="nav-links">Self-Test</a>

    </div>
</nav>

<body>
    <header>Hand Sign Learning</header>
    <div class="content-wrapper">
        <div class="subtitle-container">
            <div class="subtitle">
                <h2>Learning How to Sign Names</h2>
            </div>
        </div>
        <div class="container">
        <!-- Form to enter and submit the name -->
        <div class="box">
            <p>Enter your name:</p>
            <div class="buttons">
                <form action="/save_name" method="POST" onsubmit="resetImagesOpacity()">
                    <label for="username"></label>
                    <input type="text" id="username" name="username">
                    <div id="savecleer">
                        <button class="save" type="submit" name="action" value="save">Submit</button>
                        <button type="submit" name="action" value="clear">Clear</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Display the images corresponding to the entered name -->
        <div class="result">
            {% if images %}
            <div class="images">
                {% for image in images %}
                    {% if loop.first %}
                        <img src="{{ image }}" alt="Letter Image" onload="checkImagesLoaded()" style="opacity: 1;"> <!-- First image -->
                    {% else %}
                        <img src="{{ image }}" alt="Letter Image" onload="checkImagesLoaded()" style="opacity: 0.4;"> <!-- Other images -->
                    {% endif %}
                {% endfor %}
            </div>
            <script>
                let imagesLoaded = 0;
                const totalImages = document.querySelectorAll('.images img').length;

                function checkImagesLoaded() {
                    imagesLoaded++;
                    if (imagesLoaded === totalImages) {
                        startIntro(); // Start Intro.js when all images are loaded
                    }
                }
            </script>
            {% endif %}
        </div>

        <!-- Camera feed and prediction text -->
        <div id="camera">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="canvas" width="320" height="240"></canvas>
            <div id="cameraStatus" class="status info" style="display:none;">Initializing camera...</div>
        </div>
        <div id="predictionContainer">
            <p id="predictionText">Initializing...</p>
            <span class="detection-indicator">Real-time detection active</span>
        </div>
    </div>
    </div>
    <script src="/static/JS/intro.min.js"></script>
    <script src="/static/JS/learningName.js"></script>
    
    <script>
        // Initialize camera when the page loads
        document.addEventListener('DOMContentLoaded', function() {
            console.log("DOM loaded, initializing camera for learningName.js");
            
            // Initialize camera after a brief delay
            setTimeout(function() {
                if (typeof initCamera === 'function') {
                    initCamera();
                    console.log("Camera initialization called");
                } else {
                    console.error("Camera handler not loaded properly");
                    document.getElementById('predictionText').textContent = "Camera handler not available";
                }
            }, 500);
        });
    </script>
</body>
</html>
